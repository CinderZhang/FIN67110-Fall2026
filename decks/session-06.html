# Lab 06 — The Seeker

**One thing today: turn a book's chapter into a skill your agent runs: a spinoff seeker that finds U.S. spinoffs on EDGAR, prices them with your own code, and ranks a screen by factors you declared.** (45 minutes, after the teaching.)

**You arrive with:** your agent team running; your closes reader printing a close; your factor
list written by hand, with the direction each factor should point and the chapter it came from;
one recent Form 10 read; your agent's skills and hooks pages read.
</textarea></section>
<section data-markdown><textarea data-template>
## Open — the paired review (10 minutes)

1. **Tools alive.** The closes reader prints the last close before a time; your agent lists its
   skills, the minimal one you made among them.
2. **Defend.** Read your partner your factor list. Partner asks: which factor would the book's
   author strike, and why?
3. **Gap check.** Write the filing sequence of a spinoff from memory: the forms, in order, from
   the announcement to the first Form 4. If you cannot, that is today's gap.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 1 — a chapter is a procedure

Both authors tell the same story. A parent distributes shares of a business to its own
holders. Those holders never chose it, and many sell. An index fund must sell it if it is not
in the fund's index. Analysts do not cover it yet. So for some months the price can sit below
what the business is worth, and nobody has to be wrong for that to happen: the sellers are
selling for reasons that have nothing to do with value. Klarman's cases add two more timings:
the parent before the distribution, when holders sell it to buy the piece they want; and the
leftover after it, when they dump what they did not want. Read as a procedure, the chapter
says: find every spinoff; learn who had to sell and whether they have finished; read what the
parent left inside it; value it from what it earns, not from what it trades at; and look at the
parent too.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 1 — a chapter is a procedure (continued)

The rule is Week 3's again: the search and the checks are deterministic, the judgment is
dynamic. Code finds the filings, reads the dates, prices the names and counts the points. A
model, from your persona, says why this one may be cheap, or why it is not that story, and what
in the next filing would change the view.

| In the skills | Code | The model |
|---|---|---|
| the seeker | reads EDGAR, fills the registry, prices, ranks, writes the report | nothing |
| the worksheet's facts | from the filings, each with its section; pro forma or reported | nothing |
| owner cash flow and the value range | the arithmetic, printed, by the method in your file | nothing |
| the judgment | hands the persona the worksheet | why it may be cheap; what would change the view |
| the view | records it with its number | chooses the view, the number and the conviction |
| the hook | looks up every number in a filing, the facts or a printed computation | nothing |
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 2 — the filing sequence of a spinoff

A spinoff leaves a trail on EDGAR, and most leave the same one, which is why a script can find
them. The parent
announces the plan in an 8-K, often months ahead. The new company registers its shares on a
Form 10: 10-12B for an exchange listing, 10-12G otherwise. The information statement, the
document the parent's holders receive, is attached to it as an exhibit, and it carries the
parent, the distribution ratio, the record and distribution dates, the pro forma financials,
and what the parent is leaving inside: debt raised whose cash went to the parent, liabilities,
the tax agreement that limits buybacks and sales for about two years. Amendments follow. The
exchange files a CERT when it approves the listing; when-issued trading starts about a week
before the distribution. At the distribution an 8-K is filed, and often by the parent, not by the new
company, so a seeker that reads only the new company's list can miss the day it started
trading. The new company's own list then begins: Form 4s by insiders, the first 10-Q, the first
10-K, and any of those proves it trades. Other endings
exist: a withdrawal, a deregistration because the business was merged away, or an S-1 because
the plan became an IPO. Your seeker reads this trail; the facts it establishes go into a
registry with the filing and section beside each.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 2 — the filing sequence of a spinoff (continued)

Four facts that bite, each the kind a cold run finds. The first price in a vendor's file is
often the when-issued print, days before the distribution; your window starts at the
distribution. A 10-12G is filed by many funds and shells that are not spinoffs; a first test is
whether the filing holds an information statement, the proof is a parent distributing shares of
the business, and the seeker reads anything small before trusting it. The pro forma statements can understate the standalone costs the business will carry,
taxes, corporate overhead and interest on the new debt, so the worksheet reads their notes and
records a cost it cannot establish as "not known." And index membership on most student data
is current only, so the forced-selling story is read from the parent's index and the new
company's listing, and said as a reading, not a fact.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 3 — the screen is a hypothesis

A screen ranks names so you read the likely ones first. The factors come from the chapters:
small relative to the parent, so the parent's holders dump it; weak in its first weeks, so the
selling is under way; few analysts, so nobody has priced it; insiders buying, which is Form 4 with
transaction code P, an open-market or private purchase; small in absolute size. Each one has a direction the
chapter predicts. Your factors file states each factor, its weight and its direction, and the
report prints every name's points per factor, so a partner can recompute a rank. The weights
are yours and they are unvalidated until a check says otherwise, and the report says so.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 3 — the screen is a hypothesis (continued)

The check is a procedure too, and it is Thursday's Expand. Write the test before you see a
return: which past spinoffs, from which source, entered on which day after the distribution,
held how long, compared with what. Then run it once. Count the comparisons you made: twenty
cells and five factors are a hundred tests, so about five pass at the five-percent level by
chance, and the honest result says which factor passed in the cell you named first. The
published evidence, on the readings page, is mixed, and its samples end years ago; whether the
effect survived the people who read those papers is the question your check asks of a later
sample. A ranking with no check is a story with points.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 4 — the worksheet

One name, one file, every figure with its filing, its section and its date. The non-negotiables,
from the chapters and from the instructor's own worksheet: cite every fact; mark each figure
by the statement it came from: historical, pro forma, or reported after the spin, because a
Form 10 holds the first two side by side; value
as a range, a low and a mid case at least, from owner cash flow, which is after-tax earnings
plus depreciation minus capital spending, never a multiple of EBITDA alone; compare the price
with the low case; list what the parent pushed into it; look at the parent after the spin;
count insiders' open-market purchases; say whether the name can be bought at the purchase size
you wrote for your client; and write what is not known. The instructor's worksheet, its headings only, the
shape, not your answer:
</textarea></section>

The persona fills one part: why it may be cheap, and what would change the view. Write it by

with the chapter beside each criterion and never a copied passage.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 5 — the hook: code the agent cannot skip

A hook is a command your agent runs at an event: before a tool call, after one, when it is
about to say it is done. A skill's instructions can be skipped by a model; a hook cannot. This
week's hook reads a skill's output and checks every number: one that claims a tag and a period
against the run's facts file, exactly; one that claims a filing and a line against that
filing's saved text; one computed from printed inputs by recomputing it; a rate or a weight
against the skill's own file. A number of no such kind fails. On a failure the hook refuses and
prints the line. At the finishing event a refusal does not end the turn; the agent keeps
working, which is the refusal you want. Two things to know before you enable one: a hook runs
with your permissions, so read its file first (Codex asks you to trust each hook by name before
it runs); and a hook that calls a model is a model call, not a check.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 6 — two horizons, and what the price already said

The worksheet says two things, and they are not the same claim. The value range is about years;
Greenblatt did not promise next week. The view, more or less than the price, is about this
release. Only the view enters the hit rate: your code, from the closes your reader pulls, takes
the last close before the filing time and the first close after it, and the return between them
is the reaction. A view written before the reaction is scored; a view written after it saw the
move and is marked "after." Over a season, the share of views that agree with the reaction is a
hit rate, and a coin scores about half. And one check before you trust any backtest: ask your
model, in a fresh chat with tools off, a figure from a release you have; if it answers right, it
may have seen that release, and that quarter is then not a clean test of the model, whatever it
says about it. Live releases are the clean test.
</textarea></section>
<section data-markdown><textarea data-template>
## Application — the live record's companies

The seeker finds names nobody is covering; the live record reads the names everybody is. Each
week your team's desk runs on at least one earnings release, or other SEC report, filed that week,
and the worksheet skill writes its view. The season's story is companies spending on data centers faster than
their operations pay for it, and a value worksheet reads that the way it reads a spinoff: cash
from operations against capital spending, debt raised and where it went. One trap your code
must handle: a 10-Q's cash flow statement is year to date, so a quarter's capital spending is
the difference between two filings' lines. A starting set for the partner's picks and the live
record, on both sides of the build-out: Oracle, Microsoft, Alphabet, Amazon, Meta, CoreWeave,
NVIDIA, AMD, Broadcom, Dell, Super Micro, Vertiv. The calendar says which week each reports.
</textarea></section>
<section data-markdown><textarea data-template>
## Three levels

- **Must.** The seeker with its registry and its ranked screen; the worksheet on one name your
  partner picked, with the persona you wrote and the hook; a view on the live release; the
  first live report; and a start on the one thing your team chose to own, at whatever depth
  Thursday reaches.
- **Expand.** A second seeker from a second chapter, stocks below net current asset value, from
  the facts file your desk already reads; or the factor check, pre-registered, on past spinoffs
  from WRDS.
- **Ship.** Both skills as a plugin your teammates install with one command, with evals that
  run the same question with and without the skill and grade the answers, and a release tag. A
  skill someone else can run is the thing this course is for.

Expand and Ship are where your ambition goes, and nobody will tell you which to take.
</textarea></section>

yours: the folder, the factors and their weights, the window, the shape of the report, the name.
Send it as it is or in your own words, and keep every sentence that says "never."

1. Send your coding agent the request:

<section data-markdown><textarea data-template>
## I — build it from the contract (continued)

   > Make a skill for my coding agent, in the folder where my agent reads skills, and name it
   > for what it seeks. It finds U.S. spinoffs on SEC EDGAR whose distribution date is on or
   > after a start date I give. It reads EDGAR's form indexes for Form 10 registrations, their
   > amendments, the exchanges' CERT filings and the 8-Ks filed at a distribution, and it reads
   > each filing's folder on EDGAR for the facts it needs, sending my SEC User-Agent from .env
   > on every request and staying under the rate EDGAR allows. It keeps a registry file of facts
   > it established by reading a filing: the parent, the distribution ratio, the record and
   > distribution dates, each with the filing and the section it came from. It fills the
   > registry from the filings it can read; a fact it cannot find stays blank, and the report
   > says so. It never estimates a fact. It drops a registrant that is not a spinoff, with the
   > reason and the filing beside it: a Form 10 with no information statement, a fund, or a
   > company registering shares it already has is dropped, unless a later filing shows a parent
   > distributing the business. It gives each name a stage: registered, listing approved,
   > trading, in its window, or past it. The distribution 8-K is often the parent's, so the
   > skill reads the parent's filings from the registry's parent CIK; a 10-Q, a 10-K or a Form 4
   > in the new company's own filing list proves it trades. A name's first price is the first
   > close after the distribution date, never a when-issued price. It takes closes from my
   > closes reader and prints the price date beside every price. It ranks the names in their
   > window by the factors in a file I write, each with its weight and direction, and the same
   > file states the window's length in days after the distribution; it prints each name's
   > points per factor, and a name missing a date it needs is listed unranked, with the reason.
   > It writes a report with the run date, the price date and the index date on the first line,
   > the names in their window by rank, the watch list of registered names not yet trading, what
