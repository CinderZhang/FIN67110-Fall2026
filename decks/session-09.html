# Lab 09 — Prove It Together

**One thing today: prove the joined desk on names nobody on your team chose, measure what the join changed, and file the team proposal.**

**You arrive with:** one command that runs your desk end to end; the Checkpoint 3 draft; this
week's live release chosen, and who runs it.
</textarea></section>
<section data-markdown><textarea data-template>
## Open — the paired review (10 minutes)

1. **Tools alive.** The one command runs; the replay runs with the network off.
2. **Defend.** Read your partner the paragraph of your draft proposal that says which join your
   desk uses where. Partner points at the arrow in your diagram that it describes.
3. **Gap check.** Write one line: what in your final report comes from the worksheet, and what
   would be there without it?
</textarea></section>
<section data-markdown><textarea data-template>
## D — the question, the same for everyone

> On names nobody on your team chose, does one command produce a verified report with a view,
> and what did joining the parts change?
</textarea></section>
<section data-markdown><textarea data-template>
## R — what you work from

| Input | Where |
|---|---|
| Your team's desk | wherever your team keeps it |
| Names you did not choose | your partner, from another team, picks two U.S. companies that reported in the past 30 days; at least one from the build-out set on the [Week 4 page](../week-04/index.html#application--the-ai-build-out-oracle-first) |
| The three-column table | [Week 5 page](../week-05/index.html), Teaching 3 |
| The proposal's shape | below |
</textarea></section>
<section data-markdown><textarea data-template>
## I — make it yours, then prove it general

1. **Own the join.** As a team, write which join your desk uses where, in one line at the top of
   the repository's README, under the thing you own. If the tool join is yours, show the sentence
   in the role's instructions that lets it quote and forbids it to recompute.
2. **The partner's names.** Run the desk, one command each, on the two names your partner picked.
   *Expect:* two run folders; two final reports with a view; the filings on each first line; the
   spinoff parts "not applicable" where the name is not one.
3. **The three-column table,** on one of the two: the parts alone (the team's verified report and
   the worksheet's output, run as Week 4 ran them), the joined desk's final report, the filing.
   Rows: the eleven core claims, the view, the one number. Mark every row where the first two
   columns differ, and check each marked row against the third. The shape, not your answer:
   `diluted EPS, GAAP | [value] | [value] | [the filing's line]: same`;
   `the view | not computed | more than the price | the worksheet's low case, [filing], [section]`.
4. **The proposal.** As a team, finish the Checkpoint 3 page from the shape below.
5. **The live report.** If this week's release has filed, run the desk on it now, into
   `runs/live`, and upload the verified report with the view under it to Brightspace → **Live
   record** before its window closes. If it files later this week, the member you chose runs it
   then.
6. **While it runs:** one item from your gap list, in a second AI chat. Never collected.
</textarea></section>
<section data-markdown><textarea data-template>
## I — make it yours, then prove it general (continued)

**The proposal, the shape, not your answer:**

```text
# Team Ledger — pete123, maria45, jchen
Client: an investor seeking absolute return.
The desk: [one diagram: the team, the seeker, the worksheet, the hook, one command]
The joins: the worksheet is a tool of the Financial Analyst; the seeker is a pipeline step;
the hook guards both.
We own: the factor check, fixed in a file before any return is seen.
Roles: Pete, the team and the verifier; Maria, the skills and the hook; Chen, the closes
reader, the live runs and the product manual.
Live record so far: [one row per report: ticker, release, filing time, upload time, inside the window]
```
</textarea></section>
<section data-markdown><textarea data-template>
## V — prove it general

| Check | Expect |
|---|---|
| The partner's two names | two final reports from one command each; your partner opens one core claim of each at the filing's line |
| The three-column table | every marked row checked against the filing; a join that changed nothing says so |
| The proposal's diagram | the files in a run folder match the arrows in the diagram, one to one |
| The roles | every member named beside a part that exists in the repository |
</textarea></section>
<section data-markdown><textarea data-template>
## Evaluation — Learn on your own

1. What is it (the same question run two ways, compared on a fixed list of claims)?
2. How does it work here (the three-column table is one; the hit-rate table is another; what
   each can and cannot show)?
3. Explain it: what would a skill have to change in the table for your team to keep it, and what
   would make you remove it?
</textarea></section>
<section data-markdown><textarea data-template>
## Reflect

Explain two things to your partner. First, show the row of the three-column table that surprised
you. Second, name the role you took, and the part of the desk you understand least.
</textarea></section>
<section data-markdown><textarea data-template>
## Checkout — Checkpoint 3

Upload one file per team to Brightspace → **Checkpoint 3** by the end of the day
([the schedule](../schedule.html)). Submit one Markdown page that names the team. Show the desk's
design as one diagram and state which join it uses where. Name the thing the team owns, write
each member's role in one line, and include the live record so far.

**Before Session 10 — do these:** Finish the list on the [Week 6 page](../week-06/index.html). It takes about 60 minutes.

**Next:** Week 6 is a building week. Another team runs your desk from its README, and you run
theirs.
</textarea></section>

<script>
// Charts are authored as ```mermaid blocks on the pages; the markdown plugin leaves them as code.
// Each is drawn by mermaid.render, which measures in a scratch node outside reveal's scaled slides
// (measuring inside them clips the labels), and the finished SVG replaces the code block.
mermaid.initialize({ startOnLoad: false });
Reveal.initialize({ hash: true, slideNumber: true, plugins: [ RevealMarkdown ] }).then(async () => {
  const codes = [...document.querySelectorAll('.reveal code.mermaid, .reveal code.language-mermaid')];
  for (let i = 0; i < codes.length; i++) {
    const { svg } = await mermaid.render('chart' + i, codes[i].textContent);
    const div = document.createElement('div'); div.className = 'mermaid'; div.innerHTML = svg;
    codes[i].parentElement.replaceWith(div);
  }
  Reveal.layout();
});
</script>
