<section data-markdown><textarea data-template>
## Read and watch this week

- **Francis, A., & Zhang, C. X. (2026).** *Can AI match professional analysts? Evidence from a
  multi-agent system.* Finance Research Letters, 103, 110127.
  [doi.org/10.1016/j.frl.2026.110127](https://doi.org/10.1016/j.frl.2026.110127), through the
  Purdue Libraries login. Read the introduction, Section 3.1 (the architecture) and Section 4
  (results), about 30 minutes.
- **Anthropic (2024).** [Building effective agents](https://www.anthropic.com/research/building-effective-agents).
  Read to the end of "Workflow: prompt chaining", about 15 minutes. Two definitions to keep: a
  *workflow* runs model calls along a path the code fixes; an *agent* lets the model choose its own
  steps and tools.
- **Karpathy, A. (2025).** [Software Is Changing (Again)](https://www.youtube.com/watch?v=LCEmiRjPEtQ),
  Y Combinator. Watch for two ideas: a prompt is a program, and every AI tool has an autonomy slider
  that you set.
- **Zhang, C. (2026).** [The Middle Is for the Machine. The Edges Are for You.](https://cinderzhang.substack.com/p/the-middle-is-for-the-machine-the)
  The course method, about 15 minutes.
- **Karpathy, A. (2026).** [His post on reading what models write](https://x.com/karpathy/status/2105819303471976479),
  on X, about 3 minutes. Ask your model to explain things in ASD-STE100, or "80% of the way to
  ASD-STE100" because the full standard is strict; then diagrams, web pages and explainer videos,
  each, he says, better than the last. You put his first tip in your agents' instructions in Lab 01.
</textarea></section>
<section data-markdown><textarea data-template>
## Make your agents write so you can check them

Aircraft maintenance manuals are written in a controlled English, ASD-STE100, because the
technician on the tarmac cannot phone the author: one meaning per word, one instruction per
sentence, active voice, short sentences, and a hedge kept as a hedge. Karpathy's tip turns it
around: ask your model to write to you that way, "80% of the way" because the full standard is
strict. Most of your work this term is reading what agents wrote and deciding whether to trust it,
and a short sentence with one claim is a sentence you can check. It runs the other way too: a
role's instructions are read by a model that cannot ask what you meant. One rule comes with it: a
rewrite keeps every number, condition and "may"; "may have" never becomes "did".
</textarea></section>
<section data-markdown><textarea data-template>
## Four documents you need before Lab 02

A **10-K** is a company's annual report to the SEC, with the audited statements, the business
description and management's discussion; a **10-Q** is the quarterly version. An **8-K** is filed
when something material happens; the earnings release is attached to it as **Exhibit 99.1**. And
**XBRL** is the tagged data behind the statements, which EDGAR serves as a file per company, so
your code can read a number with its tag, period and filing instead of scraping a page. A
**User-Agent** is the name and email EDGAR requires from every program that downloads any of them;
yours goes in `.env` in Lab 01.
</textarea></section>
<section data-markdown><textarea data-template>
## Model, harness, agent

| Word | What it is | In your desk |
|---|---|---|
| Model | A function: text in, text out. It remembers nothing between calls and cannot open a file. | Each role is one call to it; Thursday of Week 2 |
| Harness | The program around the model: the loop, the tools it may call, the memory of the task, and the checks on what comes back | Your desk: the filings tools, the calculator, the Manager's loop |
| Agent | A model and a harness given a goal | The desk, and the coding agent that builds it |

The coding agent on your laptop is an agent whose tools are your files and your terminal. The desk
you build next week is an agent whose tools are EDGAR's filings and data, a calculator, and the model. Same shape, different
tools. When something goes wrong, the first question is always which of the two failed: the model
said something false, or the harness fed it the wrong thing and did not check.
</textarea></section>
<section data-markdown><textarea data-template>
## The paper in five numbers

The authors built a four-agent desk on one model and had it write reports on 50 U.S. companies
for the third quarter of 2024. Blinded readers compared each with the professional report from
Value Line.

| Who judged | How many comparisons | Preferred the AI report |
|---|---|---|
| Four AI judges | 200 | 71%, ranging from 48% to 96% by judge |
| MSF students | 45 | 51% |
| General public | 194 | 77% |
</textarea></section>
<section data-markdown><textarea data-template>
## The paper in five numbers (continued)

Two more results matter for this course. First, neither the AI's buy recommendations nor Value
Line's beat simply holding all 50 companies equally. Second, nobody in the study checked whether
the numbers inside the reports were right. The paper says so in its conclusion. That gap is your
term.
</textarea></section>
<section data-markdown><textarea data-template>
## Figure 1, the desk you will build

```mermaid
flowchart TD
    M[Strategy Manager<br/>assigns tasks as JSON, checks the five parts,<br/>sends a part back once if not] --> R[Research Analyst<br/>tools: the filings reader<br/>business model, position, catalysts, recent developments]
    M --> F[Financial Analyst<br/>tools: the filings reader, the XBRL facts, a calculator<br/>statements, ratios, growth, peers, each with its source]
    M --> A[Investment Advisor<br/>no tools: the two roles' outputs<br/>thesis, Buy / Hold / Sell, the deciding number]
    R --> M
    F --> M
    A --> M
    M --> N[The report, five parts]
```
</textarea></section>
<section data-markdown><textarea data-template>
## Figure 1, the desk you will build (continued)

Each box is one call to a model with its own instructions. The **Strategy Manager** is not a
smarter model. It is a loop with a checklist: send a task as JSON, read what comes back, send it
back once if a part is missing, then compile the five parts (Overview; Market Positioning and
Growth Outlook; Valuation Insights; Future Developments and Strategic Recommendations; Investment
Recommendation). That loop, the instructions, and the tools each role may use are the harness.
They are what turn a model into a desk.
</textarea></section>
<section data-markdown><textarea data-template>
## Worked example — what the Financial Analyst must get right

Open Costco's latest earnings release: on
[Costco's 8-K filing list](https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000909832&type=8-K&dateb=&owner=include&count=40),
the newest 8-K that reports Item 2.02, then its Exhibit 99.1. The instructor opens the same page on
the screen. The quarter's claims, and where each lives in the release:
</textarea></section>
<section data-markdown><textarea data-template>
## Worked example — what the Financial Analyst must get right (continued)

| Claim | Where it lives in the release |
|---|---|
| Total revenue | the income statement, the quarter's column |
| Growth versus the same quarter last year | this quarter's total revenue ÷ the same quarter last year − 1, two columns of one table |
| Operating income | the income statement |
| Net income | the income statement, attributable to Costco |
| Diluted earnings per share | the per-share lines, GAAP |
| Cash and cash equivalents | the balance sheet |
| Diluted shares | the shares used in the per-share calculation, diluted |
</textarea></section>
<section data-markdown><textarea data-template>
## Worked example — what the Financial Analyst must get right (continued)

A desk that copies the GAAP diluted EPS from its line is right. A desk that adds back an item the
release discusses, or reports an adjusted EPS as the GAAP figure, has made a number the release's
line never states: when a release says an item added to EPS, the item is already inside the GAAP
figure. The year, read from the 10-K, is the Week 2 page's worked example. Next week you see which
kind your desk is.
</textarea></section>

<section data-markdown><textarea data-template>
## I — prove each item to your partner (continued)

1. **Python.** `python --version` (on Windows, `py --version` if `python` is not found).
   *Expect:* 3.11 or higher.
2. **The agent writes a file.** In your agent, in your work folder, send: "Create a file named
   hello.md containing today's date and the name of the model you are." *Expect:* `hello.md`
   appears in the folder; open it. An agent that answers in chat but creates no file is not
   running in this folder.
3. **The agent writes so you can check it.** In each agent, send: "Add this line to the
   instruction file you read at the start of every session in this folder, creating the file if
   there is none, and tell me its name: When you explain something to me, write 80% of the way to
   ASD-STE100, and keep every number, condition and hedge." Then ask it what a `.gitignore` file
   does. *Expect:* the file it named is in the folder, and the answer comes in short sentences,
   one claim each. Why: the [Week 1 page](../lessons/week-01/README.md#make-your-agents-write-so-you-can-check-them).
4. **The key and the fence.** Send your agent word for word, filling the brackets:
</textarea></section>
<section data-markdown><textarea data-template>
## I — prove each item to your partner (continued)

   > Create a .env file in this folder with two placeholder lines, API_KEY=paste-here and
   > SEC_USER_AGENT="[your name] [your Purdue email]", and a .gitignore that excludes .env. Then
   > write a short Python program, check_env.py, that loads .env, prints the first four characters

</textarea></section>
<section data-markdown><textarea data-template>
## I — prove each item to your partner (continued)

   Open `.env` (in a terminal in your work folder, `notepad .env` on Windows or `open -e .env` on
   a Mac), paste your model provider's key where your agent said, and save it under the same name, never
   `.env.txt`. Run the install command, then the run command. *Expect:* four characters of your
   key, three dots, then your User-Agent. This proves the file is read, not that the key works:
   Session 3 makes the first paid call.
5. **GitHub.** Put the folder in your public repository (`git push`, or on github.com
   **Add file → Upload files**, one file at a time). Open the repository on github.com in a
   private browser window, logged out. *Expect:* `check_env.py` and `hello.md` are there and
   `.env` is not. The repository is public, so this check is the one that keeps your key yours.
6. **While an install runs:** read the Anthropic page from the Week 1 page. Never collected.
7. Something not working? Debug with your AI: paste the exact command and the exact error text.
   Your partner reads the error with you before you ask the room.
</textarea></section>
