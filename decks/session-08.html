<section data-markdown><textarea data-template>
# Lab 08 — One Desk

**One thing today: join your agent team and your skills into one desk that runs with one command, with the hook on every output.** (45 minutes, after the teaching.)

**You arrive with:** your agent team running on a ticker; the seeker, the worksheet and the hook;
your hand drawing of the desk with one arrow per file; one line on which join you will use for
the worksheet.
</textarea></section>
<section data-markdown><textarea data-template>
## Open — the paired review (10 minutes)

1. **Tools alive.** The team runs on a ticker; the seeker's last report exists; the hook refuses
   the seeded copy from Lab 07.
2. **Defend.** Show your partner your drawing. Partner asks: which arrow is a file, and which is
   a call?
3. **Gap check.** Write the order the parts run in, from memory. If a model decides any step of
   it, that is today's gap.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 1 — three ways to join a skill to a team

A skill is a folder of instructions and scripts. Your agent loads the skill when a task matches its description. An agent team is a graph of roles. Each role is a model call with tools, and the team includes a verifier that no run can skip. You can join a skill and an agent team in three ways. One desk may use all three.

**The pipeline.** The team's run is the skill's input. The team saves a run folder, and the worksheet reads it. Nothing calls anything else. Files on disk are the contract. You already did this in Week 4. The pipeline is the simplest join, and it is the easiest to test because each part runs alone on a saved folder.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 1 — three ways to join a skill to a team (continued)

**The tool.** A role calls a skill the same way it calls the filings reader. For example, the Strategy Manager asks the seeker for this week's screen before it assigns work. The Financial Analyst asks the worksheet for the value range before it writes. The skill runs in code and returns a file, and the role reads that file. The role never recomputes a number that the skill computed. Here, the rule that "no model computes a number" earns its keep. The skill's output is data to the role. The verifier checks the role's use of that data just as it checks any quoted line.

**The guard.** The hook watches both the team and the skill. It runs when the team writes its report and when a skill writes its output. The hook refuses to mark the run "done" if a number has no support from a filing, a facts file, or a printed input.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 1 — three ways to join a skill to a team (continued)

Your team must choose between the pipeline and the tool, and you must write that design choice down. The pipeline is easier to test and explain. The tool lets a role use the skill's findings inside its own reasoning. A desk that uses the tool also keeps the pipeline, so you can replay a saved run without a model.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 2 — one command, and the run folder as the contract

A client runs one command. Behind that command, your code fixes the order of the parts, never a model. First, the seeker runs when the client asks for a screen. Next comes the pick, either from the screen or from the ticker the client gave. Then the team runs on that ticker. Next, the worksheet runs on the team's run. The hook runs on every output. Finally, the desk produces the report with the view at the end. Each part writes into one run folder, and the next part reads only from that folder. The first line of the final report names every filing that any part read.

Here is what goes wrong when teams join parts, in the order you will meet each problem:
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 2 — one command, and the run folder as the contract (continued)

- **Two parts fetch the same filing twice** and get two versions, because the facts file changed between calls. Fetch the filing once, save it, and read from the saved file.
- **A role is handed a skill's output as text** and starts recomputing it. Hand the output to the role as a file. Tell the role what it may do with the file: quote it, and never recompute it.
- **The hook reads a file no part wrote.** You met this in Week 4's cold run. Make sure the hook reads the saved outputs themselves.
- **The joined desk is slower than the sum,** and nobody knows where the delay is. Have each part print the seconds it took on its last line.
- **A name the seeker never saw.** The worksheet's spinoff parts print "not applicable", and the rest of the desk runs. The desk does not stop for a company that is not a spinoff. Most companies are not spinoffs.
- **One part fails and the others run on.** Stop the command at the part that failed. Print which part failed and the error, and keep the run folder for the replay.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 3 — measure what the join changed

The honest measure of a join is not that it runs. The honest measure is what the join changed. Take one name and build the three-column table. Column one holds the parts alone, just as Week 4 left them, with the team's verified report and the worksheet's output side by side. Column two holds the joined desk's final report. Column three holds the filing. The rows are the eleven core claims from the [audit page](../reference/audit-checklist.html), the view, and the one number that decides the view. When a claim differs between the first two columns, check it against the third column. If a join changed nothing, it is a pipeline, and the table says so. If a join changed a number, it is a tool, and the table shows whether the change was right. Put this three-column table in your product manual. The project's reader will look for it.
</textarea></section>
<section data-markdown><textarea data-template>
## Teaching 4 — the proposal

Checkpoint 3 is one page: the proposal. It lists the team. It shows the desk's design as one diagram that includes the team, the skills, the hook, and the one command. It includes one paragraph that explains which join the desk uses where. It names the thing the team owns, states each member's role in one line, and shows the live record so far. This proposal is the product manual's first page, and every later draft grows from it.
</textarea></section>
<section data-markdown><textarea data-template>
## Three levels

- **Must.** One command runs the desk end to end on any ticker; the three-column table on one name; the proposal.
- **Expand.** The tool join in one place: the Manager calls the seeker, or the Analyst calls the worksheet, with the role's permission to quote and not to recompute written in its instructions. Or the institution's client: a mandate skill, a file of limits (long only, a cap per name, a cap on all names together, a floor on how much is invested, the benchmark, the fee) and code with no model call that turns the worksheet's views into positions inside the limits and reports the holding week's return against the benchmark, net of fee. A team that serves an institution builds this as the thing it owns, and its product manual compares relative return net of fee against the benchmark.
- **Ship.** The desk as a plugin another team installs and runs with one command, with an evaluation that runs the same name with and without each skill.
</textarea></section>
<section data-markdown><textarea data-template>
## D — the question, the same for everyone

> Can one command run the team and the skills in an order code fixes, through one run folder,
> with every number still traced and the hook still able to refuse?
</textarea></section>
<section data-markdown><textarea data-template>
## R — what you work from

| Input | Where |
|---|---|
| The three joins and what goes wrong | [Week 5 page](../week-05/index.html), Teaching 1 and 2 |
| The team, the seeker, the worksheet, the hook | your repository, as Weeks 3 and 4 left them |

| Your drawing | your hand |
</textarea></section>
<section data-markdown><textarea data-template>
## I — build it from the contract

Here is the contract for the joined desk. It states what the desk must do and what it must never
do. You own the design: choose which join to use, lay out the run folder, and name the command.
Send the request as written or in your own words, and keep every sentence that says "never."

1. Send your coding agent the request:
</textarea></section>
<section data-markdown><textarea data-template>
## I — build it from the contract (continued)

   > Join my agent team and my skills into one desk that runs with one command, and put it
   > behind the page from Lab 05. The command takes a ticker, or the word "screen" to take the
   > top name from my seeker's latest report. It runs the parts in an order fixed in code, never
   > chosen by a model: the seeker when asked, the pick, the agent team on the ticker, the
   > worksheet skill on the team's saved run, and the hook on every output. Every part reads
   > from and writes into one run folder, named by the ticker and the date and time the command
   > started, and no part fetches a filing another part already saved. Where a role uses a
   > skill's output, it receives the output as a file; it may quote the file's lines and may
   > never recompute them. The final report is the team's verified report with the worksheet's
   > view under it, and its first line names every filing any part read. Each part prints the
   > seconds it took on its last line. When the ticker is not in the seeker's registry, the
   > spinoff parts print "not applicable" and the rest runs. When any part fails, the command
   > stops, prints which part failed and the error, and keeps the run folder. The hook runs on
   > the final report as it runs on a skill's output. The page runs this command and shows the
   > final report. Nothing in the code names a company. Tell me the exact command to run the
   > desk on a ticker, the exact command to run it from the screen, and the exact command to
   > replay a saved run without fetching anything.
</textarea></section>
<section data-markdown><textarea data-template>
## I — build it from the contract (continued)

   Rewrite it in ASD-STE100 yourself before you send it, as Week 1 taught; a sample is [here](../week-05/requests.html#lab-08-one-desk).
</textarea></section>
<section data-markdown><textarea data-template>
## I — build it from the contract (continued)

2. Run the desk on the name your worksheet ran on in Lab 07. *Expect:* one run folder; each
   part's output in it; the final report with the view under it and the filings on its first
   line; the seconds per part. Then run it from the screen. *Expect:* the top name of the
   seeker's report, or "not applicable" on the spinoff parts if the screen is empty.
3. Replay the saved run with the network off. *Expect:* the same final report, and no fetch.
4. Copy the final report, change one amount by one, and run the hook on the copy. *Expect:* a
   refusal that names the line. The shape, not your answer: `refused: line 14, [amount] is not in
   [filing], [section]`.
5. **While it runs:** work one item from your gap list in a second AI chat. Never collected.
6. Something not working? Debug with your AI: paste the exact command and the exact error text.
</textarea></section>
<section data-markdown><textarea data-template>
## V — prove it on the known answer

| Check | Expect |
|---|---|
| The run folder | one folder; every part's output inside; the team's run and the worksheet read from it, nothing fetched twice |
| The final report's first line | every filing any part read, the Form 10 among them when the name is a spinoff |
| The core claims | the same values as the team's own report on the same name; your partner checks two against the filing |
| The seeded copy | refused, by line |
| The replay | the same report with the network off |
| A ticker not in the registry | "not applicable" on the spinoff parts; the rest ran |
| The order of the parts | printed, the same on two runs; no model chose it |

Match every check, or debug with your AI.
</textarea></section>
<section data-markdown><textarea data-template>
## Orchestration — Learn on your own

1. What is it (code that fixes the order in which parts run, and a model that chooses none of
   it)?
2. How does it work here (which lines of your command are the order, and what would a model
   choosing the order have cost you on the replay)?
3. Explain it: open your agent's page on subagents. What does it hand to a subagent and what does
   it get back, and where is the run folder in that picture?
</textarea></section>
<section data-markdown><textarea data-template>
## Reflect

Explain two things to your partner. First, name the join you chose for the worksheet, and read
the one sentence in a role's instructions that stops it from recomputing. Second, name the part
you would cut if the client gave you half the time.

**Before Session 9 — do these:** complete the list on the [Week 5 page](../week-05/index.html#before-session-9--about-30-minutes),
which takes about 30 minutes.

**Next:** In Lab 09, you will prove the joined desk on names your partner picks, measure what the
join changed, and file the team proposal.
</textarea></section>
